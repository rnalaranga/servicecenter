name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/servicecenter
            git pull origin main

            # Backend deployment
            cd /var/www/servicecenter/backend
            npm install
            npx prisma db push
            npx prisma generate
            npm run build
            pm2 restart servicecenter-backend

            # Frontend deployment
            cd /var/www/servicecenter/frontend
            npm install
            npm run build
            sudo systemctl reload nginx
